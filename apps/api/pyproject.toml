[project]
name = "pratyay-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.165",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pydantic-settings>=2.16",
  "pdfplumber>=0.11",
  "cryptography>=47",
  "scikit-learn>=1.9.1",
  "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.12",
    "pytest-asyncio>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
