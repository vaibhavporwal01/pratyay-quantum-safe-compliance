services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: pratyay
      POSTGRES_PASSWORD: pratyay
      POSTGRES_DB: pratyay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratyay"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
